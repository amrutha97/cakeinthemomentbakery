name: Sync Instagram feed

on:
  schedule:
    - cron: "17 14 * * *" # daily, ~7am Pacific
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "IG_ACCESS_TOKEN secret not set yet; skipping. See INSTAGRAM_SETUP.md"
            exit 0
          fi
          node scripts/fetch-instagram.mjs

      - name: Commit changes
        run: |
          git config user.name "instagram-sync[bot]"
          git config user.email "instagram-sync[bot]@users.noreply.github.com"
          git add data/instagram.json assets/instagram
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Update Instagram feed"
            git push
          fi
